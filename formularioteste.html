<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Formulário de Cadastro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;

      margin-bottom: 16px;
    }
    button {
      background: #2b7cff;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #1f5fd4;
    }
  </style>
</head>
<body>

  </form>

</body>
</html>
